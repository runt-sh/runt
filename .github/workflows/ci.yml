name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      - run: make test
      - name: Build release binaries
        run: |
          cargo build --release -p runt
          cargo build --release -p runt-agent --target x86_64-unknown-linux-musl
          ls -l target/release/runt target/x86_64-unknown-linux-musl/release/runt-agent
