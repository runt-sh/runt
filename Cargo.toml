[workspace]
resolver = "3"
members = ["crates/runt-proto", "crates/runt-net", "crates/runt-agent", "crates/runt-vmm", "crates/runt-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/runt-sh/runt"
rust-version = "1.90"

[workspace.dependencies]
runt-proto = { path = "crates/runt-proto" }
runt-vmm = { path = "crates/runt-vmm" }
runt-net = { path = "crates/runt-net" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
